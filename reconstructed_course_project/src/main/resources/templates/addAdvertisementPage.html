<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/headers::head(title='Add Advertisement')">
</head>

<body>
<div class="container">

    <div th:replace="fragments/nav::nav"></div>

    <h2>Add Advertisement</h2>

    <div th:if="${errorMessage}"
         class="alert alert-danger"
         th:text="${errorMessage}">
        Error
    </div>

    <div th:if="${cars.isEmpty()}"
         class="alert alert-info">

        <p>
            You need to add a car before publishing an advertisement.
        </p>

        <a class="btn btn-success" th:href="@{/addCar}">
            Add a car
        </a>
    </div>

    <form th:if="${!cars.isEmpty()}"
          th:action="@{/addAdvertisement}"
          th:object="${advertisementForm}"
          method="post">

        <div class="form-group">
            <label for="carId">Your car *</label>

            <select id="carId"
                    class="form-control"
                    th:field="*{carId}"
                    required>

                <option value="">Select a car</option>

                <option th:each="car : ${cars}"
                        th:value="${car.id}"
                        th:text="${car.brand + ' ' + car.model
                            + ' (' + car.year + ')'}">
                    Toyota Corolla (2018)
                </option>
            </select>

            <small class="form-text text-muted">
                Photos and technical details come from your car record.
                Manage your cars to update them.
            </small>
        </div>

        <div class="form-group">
            <label for="description">Exchange proposal *</label>

            <textarea id="description"
                      class="form-control"
                      th:field="*{description}"
                      rows="6"
                      maxlength="5000"
                      placeholder="Describe your car and what kind of
                          exchange you are looking for."
                      required></textarea>
        </div>

        <button class="btn btn-success" type="submit">
            Publish Advertisement
        </button>

        <a class="btn btn-outline-secondary"
           th:href="@{/myAds}">
            Cancel
        </a>
    </form>

</div>
</body>
</html>

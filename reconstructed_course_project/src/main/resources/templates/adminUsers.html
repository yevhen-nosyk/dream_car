<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/headers::head(title='Users')">
</head>

<body>
<div class="container">

    <div th:replace="fragments/nav::nav"></div>

    <h2>Users</h2>

    <table class="table table-hover">
        <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Account status</th>
            <th>Rating</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.name}">Name</td>
            <td th:text="${u.email}">email</td>
            <td th:text="${u.role}">ROLE_AUTHORIZED</td>
            <td>
                <span th:text="${u.accountStatus}">ACTIVE</span>
            </td>
            <td th:text="${u.rating}">0</td>

            <td>
                <form th:if="${u.role != 'ADMIN'
                              and u.id != session.currentUser.id
                              and u.accountStatus == 'ACTIVE'}"
                      th:action="@{/admin/ban}"
                      method="post">

                    <input type="hidden"
                           name="id"
                           th:value="${u.id}"/>

                    <button type="submit"
                            class="btn btn-sm btn-danger">
                        Ban
                    </button>
                </form>

                <form th:if="${u.role != 'ADMIN'
                              and u.accountStatus == 'BANNED'}"
                      th:action="@{/admin/unban}"
                      method="post">

                    <input type="hidden"
                           name="id"
                           th:value="${u.id}"/>

                    <button type="submit"
                            class="btn btn-sm btn-success">
                        Unban
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>

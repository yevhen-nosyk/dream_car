<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/headers::head(title=${boxTitle})"></head>
<body>
<div class="container">
    <div th:replace="fragments/nav::nav"></div>
    <h2 th:text="${boxTitle}">Requests</h2>
    <table class="table table-hover">
        <tr>
            <th>#</th>
            <th>Sender</th>
            <th>Receiver</th>
            <th>Date</th>
            <th>Status</th>
            <th>Deposit</th>
            <th></th>
        </tr>
        <tr th:each="r:${requests}">
            <td th:text="${r.id}">1</td>
            <td th:text="${r.senderId}">1</td>
            <td th:text="${r.receiverId}">2</td>
            <td th:text="${r.sendingDate}">date</td>
            <td th:text="${r.status}">SENT</td>
            <td th:text="${r.deposit.sum}">0</td>
            <td th:if="${boxTitle == 'Incoming requests' and r.status == 'SENT'}">
                <form th:action="@{'/requests/'+${r.id}+'/accept'}" method="post" class="d-inline">
                    <button class="btn btn-sm btn-success">Accept</button>
                </form>
                <form th:action="@{'/requests/'+${r.id}+'/reject'}" method="post" class="d-inline">
                    <button class="btn btn-sm btn-danger">Reject</button>
                </form>
            </td>
        </tr>
    </table>
</div>
</body>
</html>

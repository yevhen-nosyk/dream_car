<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/headers::head(title='Login')"></head>
<body>
<div class="container">
    <div th:replace="fragments/nav::nav"></div>
    <h2>Login</h2>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">Error</div>
    <form th:action="@{/login}" th:object="${loginForm}" method="post">
        <div class="form-group"><label>Email</label><input class="form-control" type="email" th:field="*{email}"
                                                           required/></div>
        <div class="form-group"><label>Password</label><input class="form-control" type="password"
                                                              th:field="*{password}" required/></div>
        <button class="btn btn-primary" type="submit">Log in</button>
    </form>
    <p class="mt-3">No account? <a th:href="@{/register}">Register</a></p></div>
</body>
</html>
